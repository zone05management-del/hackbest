<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACCESS NODE // Secure Gateway</title>
  <meta name="theme-color" content="#0aff6c" />
  <style>
    :root{
      --bg:#050807;--grid:#0a130f;--txt:#c9ffe1;--accent:#18ff62;--accent2:#49ffd7;--err:#ff3f58;--warn:#ffe15c;
    }
    html,body{height:100%}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(1200px 800px at 15% 10%, rgba(24,255,98,.07), transparent),radial-gradient(1000px 700px at 85% 90%, rgba(73,255,215,.06), transparent),var(--bg);color:var(--txt);font:15px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;overflow:hidden}

    /* Matrix canvas */
    #mx{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg, rgba(24,255,98,.05), transparent)}

    /* Subtle grid */
    .grid::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);background-size:40px 40px;mask:linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,0));pointer-events:none}

    .wrap{position:relative;z-index:1;display:grid;place-items:center;height:100%;}

    .panel{width:min(520px, 92vw);padding:26px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));box-shadow:0 18px 60px rgba(0,0,0,.45);backdrop-filter: blur(4px)}

    .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .led{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
    .badge{padding:2px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:var(--accent)}

    .title{margin:0;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

    form{display:grid;gap:12px;margin-top:14px}
    label{display:grid;gap:6px;font-size:12px;color:#9fe7bd}
    input{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);color:var(--txt);outline:none;box-shadow:inset 0 0 0 1px rgba(24,255,98,.15)}

    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .btn{cursor:pointer;border:none;padding:12px 16px;border-radius:12px;color:#06140a;background:var(--accent);font-weight:800;letter-spacing:.06em;box-shadow:0 10px 22px rgba(24,255,98,.25)}
    .ghost{background:transparent;color:var(--txt);border:1px solid rgba(24,255,98,.35);padding:10px;border-radius:10px}

    .status{min-height:22px;font-size:12px;color:#a9eec6}
    .status.err{color:var(--err)}
    .status.ok{color:var(--accent)}

    .progress{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
    .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent), var(--accent2));box-shadow:0 0 18px rgba(24,255,98,.65)}

    .foot{display:flex;gap:8px;justify-content:space-between;margin-top:14px;color:#90dcb1;font-size:12px;opacity:.9}

    /* Glitch heading */
    .glitch{position:relative;display:inline-block;filter:drop-shadow(0 0 6px rgba(24,255,98,.45))}
    .glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;clip-path:inset(0 0 0 0);}
    .glitch::before{transform:translate(1px,-1px);color:#49ffd7;mix-blend-mode:screen;animation:shift 2.2s infinite ease-in-out}
    .glitch::after{transform:translate(-1px,1px);color:#18ff62;mix-blend-mode:screen;animation:shift 1.7s infinite reverse ease-in-out}
    @keyframes shift{0%{clip-path:inset(0 0 85% 0)}20%{clip-path:inset(15% 0 60% 0)}40%{clip-path:inset(40% 0 30% 0)}60%{clip-path:inset(70% 0 0 0)}80%{clip-path:inset(0 0 50% 0)}100%{clip-path:inset(0 0 0 0)}}

    /* Error shake */
    .shake{animation:shake .4s ease-in-out}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

    /* Floating action bar (bottom-centered horizontal) */
    .fab-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;display:flex;gap:12px;align-items:center}
    .fab{width:56px;height:56px;border-radius:28px;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);border:3px solid rgba(0,0,0,.12)}
    .fab.wa{background:#25D366;color:#fff}
    .fab.share{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#001}
    .fab svg{width:26px;height:26px}
    .fab-label{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  </style>
</head>
<body class="grid">
  <canvas id="mx"></canvas>
  <div class="wrap">
    <section class="panel" id="panel">
      <div class="hdr">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="led" aria-hidden="true"></div>
          <h1 class="title glitch" data-text="ACCESS NODE">ACCESS NODE</h1>
        </div>
        <span class="badge">v5.1</span>
      </div>

      <form id="login" autocomplete="off">
        <label>
          <span>Operator ID</span>
          <input type="text" id="user" inputmode="text" maxlength="24" placeholder="e.g. RFOX_01" required>
        </label>
        <label>
          <span>Passphrase</span>
          <input type="password" id="pass" maxlength="64" placeholder="••••••••" required>
        </label>
        <div class="row">
          <small id="status" class="status">Awaiting credentials…</small>
          <div style="display:flex;gap:10px">
            <button type="button" class="btn ghost" id="demoBtn">Generate</button>
            <button type="submit" class="btn" id="go">Authorize</button>
          </div>
        </div>
        <div class="progress" aria-label="authorization progress"><div id="bar" class="bar"></div></div>
      </form>

      <div class="foot">
        <span>Channel: AES-256 / Noise IX</span>
        <span>Latency: <b id="lat">0</b>ms</span>
      </div>
    </section>
  </div>

  <!-- Floating action bar: centered horizontally at bottom (WhatsApp + Share) -->
  <div class="fab-bar" aria-hidden="false">
    <button id="waFab" class="fab wa" title="Request access via WhatsApp" aria-label="Request access via WhatsApp">
      <!-- WhatsApp SVG -->
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 11.5c0 4.97-4.03 9-9 9a8.95 8.95 0 0 1-4-0.86L3 21l1.36-4.9A8.95 8.95 0 0 1 3 11.5C3 6.53 7.03 2.5 12 2.5S21 6.53 21 11.5z" stroke="white" stroke-width="0.6" /><path d="M17.2 14.2c-0.3 0.7-1.6 1.6-2.2 1.7-0.6 0.1-1.1 0.5-2.4-0.4-1.3-0.9-2.2-2.1-2.5-2.7-0.3-0.7 0.1-1 0.4-1.3 0.3-0.3 0.6-0.7 0.9-1 0.3-0.3 0.4-0.6 0.6-1 0.1-0.3 0-0.6-0.2-0.8-0.3-0.2-0.7-0.6-1.2-0.6-0.5 0-1.1 0.1-1.6 0.8-0.5 0.7-1.9 2.1-1.9 4.9 0 2.8 2.1 5.4 2.4 5.8 0.3 0.4 4 6.3 9.5 0.9 0 0 1.2-1 1.4-2.1 0.2-1.1 0.2-2-0.6-2.8z" fill="white"/></svg>
    </button>

    <button id="shareFab" class="fab share" title="Share this site" aria-label="Share this site">
      <!-- Share SVG -->
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7" stroke="#001" stroke-width="1.2"/><path d="M16 6l-4-4-4 4" stroke="#001" stroke-width="1.2"/><path d="M12 2v14" stroke="#001" stroke-width="1.2"/></svg>
    </button>
  </div>

  <span id="waTooltip" class="sr-only" role="status">WhatsApp: request access</span>

  <script>
    // ===== Matrix Rain (background eye-candy) =====
    const cvs = document.getElementById('mx');
    const ctx = cvs.getContext('2d');
    let W,H,cols,drops,lastTs;
    const glyphs = 'アカサタナハマヤラワ0123456789$#=+<>*';
    function size(){W=cvs.width=innerWidth;H=cvs.height=innerHeight;cols=Math.ceil(W/14);drops=Array(cols).fill(0)}
    addEventListener('resize', size); size();
    function loop(ts){
      if(!lastTs) lastTs=ts; const dt=ts-lastTs; lastTs=ts;
      ctx.fillStyle='rgba(5,8,7,0.2)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#18ff62'; ctx.font='14px monospace';
      for(let i=0;i<cols;i++){
        const ch=glyphs[Math.random()*glyphs.length|0];
        ctx.fillText(ch, i*14, drops[i]*14);
        if(drops[i]*14>H && Math.random()>0.975) drops[i]=0; else drops[i]++;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ===== Login logic (password: "rodgerfox") =====
    const form = document.getElementById('login');
    const user = document.getElementById('user');
    const pass = document.getElementById('pass');
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('bar');
    const panel = document.getElementById('panel');
    const latEl = document.getElementById('lat');
    const demoBtn = document.getElementById('demoBtn');

    // Online sounds (no local assets)
    const sBeep = new Audio('https://www.soundjay.com/buttons/sounds/beep-07a.mp3');
    const sOk   = new Audio('https://www.soundjay.com/buttons/sounds/button-29.mp3');
    const sErr  = new Audio('https://www.soundjay.com/buttons/sounds/beep-10.mp3');

    // Fake latency ticker
    setInterval(()=>{ latEl.textContent = Math.max(8, Math.min(140, (latEl.textContent|0) + (Math.random()*24-12|0))); }, 500);

    // Demo helper: generate operator ID quickly
    demoBtn.addEventListener('click', ()=>{ user.value = 'RFOX_' + (100 + (Math.random()*900|0)); sBeep.play(); user.focus(); });

    function authenticate(evt){
      evt.preventDefault();
      const u = user.value.trim();
      const p = pass.value;
      if(!u || !p){ statusEl.textContent = 'Missing credentials'; statusEl.className='status err'; panel.classList.add('shake'); sErr.play(); setTimeout(()=>panel.classList.remove('shake'),300); return; }

      statusEl.textContent = 'Verifying identity…'; statusEl.className='status'; sBeep.play();
      bar.style.width='0%';

      // Fake progress
      let prog = 0;
      const steps = setInterval(()=>{
        prog = Math.min(100, prog + (3 + Math.random()*12|0));
        bar.style.width = prog + '%';
        if(prog>30 && prog<35) statusEl.textContent = 'Checking entropy pools…';
        if(prog>60 && prog<65) statusEl.textContent = 'Negotiating cipher suites…';
        if(prog>=100){
          clearInterval(steps);
          // Password check (hardcoded)
          if(p === 'rodgerfox@254'){
            statusEl.textContent = 'Access granted'; statusEl.className='status ok'; sOk.play();
            // Save username for later pages
            try{ sessionStorage.setItem('hx_user', u); }catch(e){}
            // Small delay then redirect
            setTimeout(()=>{ location.href = 'dashboard.html'; }, 650);
          } else {
            statusEl.textContent = 'Access denied — invalid passphrase'; statusEl.className='status err'; sErr.play();
            panel.classList.add('shake'); setTimeout(()=>panel.classList.remove('shake'),400);
            pass.select();
          }
        }
      }, 120);
    }

    form.addEventListener('submit', authenticate);
    // Enter key convenience on inputs
    [user,pass].forEach(i=>i.addEventListener('keydown', e=>{ if(e.key==='Enter'){ authenticate(e); }}));

    // ===== WhatsApp quick-request and Share actions =====
    // Replace with your WhatsApp number in international format (no '+' sign). Example: "254712345678"
    let WA_NUMBER = ''; // you can set this at runtime via window.__ACCESS_NODE.setWhatsAppNumber()

    const waFab = document.getElementById('waFab');
    const shareFab = document.getElementById('shareFab');

    function generateUniqueId(){ return 'REQ-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6).toUpperCase(); }

    function buildWhatsAppMessage(userProvidedName){
      const id = generateUniqueId();
      const ts = new Date().toISOString();
      const userName = (userProvidedName && userProvidedName.trim()) || user.value.trim() || 'Guest';
      const site = location.href;
      return `Hello, I am requesting the passphrase to open the site.\n\nOperator: ${userName}\nRequestId: ${id}\nTime: ${ts}\nSite: ${site}\n\nPlease send the access passphrase. (Demo request)`;
    }

    function openWhatsApp(number, prefilledMessage){
      const encoded = encodeURIComponent(prefilledMessage);
      const url = `https://wa.me/${number}?text=${encoded}`;
      window.open(url, '_blank');
      // store request locally so dashboard can show it (UI-only)
      try{
        const reqs = JSON.parse(localStorage.getItem('access_requests')||'[]');
        reqs.unshift({id: generateUniqueId(), to:number, message: prefilledMessage, timestamp: new Date().toISOString()});
        localStorage.setItem('access_requests', JSON.stringify(reqs));
      }catch(e){}
    }

    waFab.addEventListener('click', ()=>{
      const msg = buildWhatsAppMessage();
      if(WA_NUMBER && WA_NUMBER.trim().length > 2){
        openWhatsApp(WA_NUMBER.trim(), msg);
        return;
      }
      const num = prompt('Enter WhatsApp number (international, e.g. 254706648713) to send the demo request (or Cancel to copy the message):');
      if(num && num.trim()){
        openWhatsApp(num.trim(), msg);
      } else {
        if(navigator.clipboard){
          navigator.clipboard.writeText(msg).then(()=> alert('Request message copied to clipboard. Paste it into WhatsApp to send.'), ()=> alert('Could not copy automatically — please copy the message manually:\n\n' + msg));
        } else {
          alert('Copy this message and send it via WhatsApp:\n\n' + msg);
        }
      }
    });

    // Share button: Web Share API with clipboard fallback
    shareFab.addEventListener('click', async ()=>{
      const shareText = `Check out ACCESS NODE — an interactive demo "Hacker Control Center". Explore the UI and mock data here: ${location.href}\n\nIt's a neon-themed demo for acting and presentations — join in!`;
      if(navigator.share){
        try{
          await navigator.share({ title: 'ACCESS NODE — Demo', text: shareText, url: location.href });
          return;
        }catch(err){
          // fallback to clipboard below
        }
      }
      if(navigator.clipboard){
        navigator.clipboard.writeText(shareText).then(()=> alert('Share message copied to clipboard. Paste to share.'), ()=> alert('Copy failed — please manually copy: ' + location.href));
      } else {
        alert('Your browser does not support automatic sharing. Please copy the link: ' + location.href);
      }
    });

    // small runtime helper to set WA number during a demo
    window.__ACCESS_NODE = {
      setWhatsAppNumber: function(number){
        WA_NUMBER = String(number || '').trim();
        alert('WhatsApp number set for this session.');
      },
      // helper to read stored access requests (dashboard can read localStorage directly too)
      readRequests: function(){ try{ return JSON.parse(localStorage.getItem('access_requests')||'[]'); }catch(e){ return []; } }
    };
  </script>
</body>
</html>
