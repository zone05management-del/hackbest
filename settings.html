<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Settings — Demo</title>
<style>
:root{--bg:#050807;--neon:#00ff99;--muted:#9fe7bd}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--neon);font:15px/1.6 ui-monospace,monospace}
#matrix{position:fixed;inset:0;z-index:0}
header{position:sticky;top:0;padding:12px;background:rgba(0,0,0,.5);z-index:2}
.wrap{position:relative;z-index:1;max-width:900px;margin:18px auto;padding:12px}
.card{padding:12px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);border:1px solid rgba(255,255,255,.04)}
.small{font-size:13px;color:var(--muted)}
.btn{background:var(--neon);color:#001;padding:8px;border-radius:8px;border:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<header><h1 style="margin:0">SETTINGS — DEMO</h1></header>
<div class="wrap">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><strong>Demo Data</strong><div class="small">Export / import the demo dataset used across pages.</div></div><div><button id="export" class="btn">Export JSON</button> <input id="importFile" type="file" style="background:transparent;color:var(--neon)"></div></div>
    <div style="margin-top:12px" class="small">Reset or clear demo data stored in localStorage.</div>
    <div style="margin-top:8px"><button id="clear" class="btn">Clear Demo Data</button></div>
  </div>
</div>
<script>
const mx=document.getElementById('matrix'), ctx=mx.getContext('2d'); function r(){mx.width=innerWidth;mx.height=innerHeight;} addEventListener('resize',r); r(); (function(){ ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(0,0,mx.width,mx.height); ctx.fillStyle='#00ff99'; ctx.font='14px monospace'; ctx.fillText('DEMO SETTINGS',20,30); requestAnimationFrame(arguments.callee); })();

document.getElementById('export').addEventListener('click', ()=>{
  const data = { demo_students: localStorage.getItem('demo_students'), demo_volumes: localStorage.getItem('demo_volumes'), demoDataset: localStorage.getItem('demoDataset'), demo_jobs: localStorage.getItem('demo_jobs') };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='demo_all_export.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
document.getElementById('importFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); if(data.demo_students) localStorage.setItem('demo_students', data.demo_students); if(data.demo_volumes) localStorage.setItem('demo_volumes', data.demo_volumes); if(data.demoDataset) localStorage.setItem('demoDataset', data.demoDataset); if(data.demo_jobs) localStorage.setItem('demo_jobs', data.demo_jobs); alert('Imported demo dataset into localStorage (UI-only)'); }catch(err){ alert('Invalid JSON'); } }; r.readAsText(f);
});
document.getElementById('clear').addEventListener('click', ()=>{ if(confirm('Clear all demo data from localStorage?')){ ['demo_students','demo_volumes','demoDataset','demo_jobs'].forEach(k=>localStorage.removeItem(k)); alert('Demo data cleared (localStorage).'); }});
</script>
</body>
</html>
