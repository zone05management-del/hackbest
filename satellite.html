<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Satellite — Enhanced Demo</title>
<style>
:root{--bg:#000;--neon:#00ff99;--muted:#9fe7bd}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--neon);font:15px/1.6 ui-monospace,monospace}
#matrix{position:fixed;inset:0;z-index:0}
header{position:sticky;top:0;padding:12px;background:rgba(0,0,0,.5);z-index:2;border-bottom:1px solid rgba(0,255,153,.06)}
.wrap{position:relative;z-index:1;max-width:1100px;margin:18px auto;padding:12px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.04)}
.canvas{height:420px;border-radius:8px;background:#04120b;border:1px dashed rgba(255,255,255,.04)}
.controls{display:flex;gap:8px;align-items:center;margin-top:8px}
.small{font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:60;padding:12px}
.modal.show{display:flex}
</style></head><body>
<canvas id="matrix" aria-hidden="true"></canvas>
<header><h1 style="margin:0">SATELLITE — DEMO</h1></header>
<div class="wrap">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><strong>Satellites</strong><div class="small">Simulated uplinks/downlinks & pointing controls</div></div><div><button id="scan" class="btn">Simulate Scan</button></div></div>
    <div style="margin-top:12px"><canvas id="satCanvas" class="canvas"></canvas></div>
    <div class="controls">
      <button id="point" class="btn">Point to Location</button>
      <button id="sync" class="btn">Initiate Sync</button>
      <button id="showLog" class="ghost">Show Log</button>
      <a href="dashboard.html" class="ghost">← Dashboard</a>
    </div>
  </div>
</div>

<div id="modal" class="modal" aria-hidden="true"></div>

<script>
// matrix
const mx=document.getElementById('matrix'),mctx=mx.getContext('2d'); let W,H,cols,drops; function rs(){W=mx.width=innerWidth;H=mx.height=innerHeight;cols=Math.ceil(W/14);drops=Array(cols).fill(0);} addEventListener('resize',rs); rs();
const glyph='01ABCXYZ$#'; (function a(){ mctx.fillStyle='rgba(0,0,0,0.08)'; mctx.fillRect(0,0,W,H); mctx.fillStyle='#00ff99'; mctx.font='14px monospace'; for(let i=0;i<cols;i++){ const ch=glyph[Math.floor(Math.random()*glyph.length)]; mctx.fillText(ch,i*14,drops[i]*14); if(drops[i]*14>H && Math.random()>0.975) drops[i]=0; drops[i]++; } requestAnimationFrame(a); })();

// satellite canvas
const c=document.getElementById('satCanvas'), ctx=c.getContext('2d');
function resizeCanvas(){ c.width=c.clientWidth; c.height=c.clientHeight; draw(); } addEventListener('resize', resizeCanvas); resizeCanvas();

function draw(){
  ctx.fillStyle='#04120b'; ctx.fillRect(0,0,c.width,c.height);
  // draw earth circle
  const cx=c.width/2, cy=c.height/2, r=Math.min(c.width,c.height)/4;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#0a2b20'; ctx.fill();
  ctx.strokeStyle='rgba(0,255,153,.08)'; ctx.stroke();
  // satellites
  for(let i=0;i<6;i++){
    const ang = (Date.now()/5000 + i*1.2)% (Math.PI*2);
    const sx = cx + Math.cos(ang)*(r+80), sy = cy + Math.sin(ang)*(r+60);
    ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fillStyle='#18ff62'; ctx.fill();
  }
}
document.getElementById('scan').addEventListener('click', ()=>{ const modal=document.getElementById('modal'); modal.innerHTML='<div class="sheet"><h3>Simulated Scan</h3><div class="small">No network activity performed. This is a UI demo.</div><pre style="margin-top:8px;color:var(--neon)">Satellite-01: uplink OK\nSatellite-02: no response\nRelay-03: sync queued\n</pre><div style="margin-top:10px"><button id="close" class="btn">Close</button></div></div>'; modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); modal.querySelector('#close').addEventListener('click', ()=>{ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); setTimeout(()=>modal.innerHTML='',250); }); });
document.getElementById('point').addEventListener('click', ()=>{ alert('Pointing satellite (simulated) — UI-only'); });
document.getElementById('sync').addEventListener('click', ()=>{ alert('Sync started (simulated)'); });
document.getElementById('showLog').addEventListener('click', ()=>{ alert('Show log (UI-only)'); });

</script>
</body>
</html>
