<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Scan — Demo</title>
<style>
:root{--bg:#000;--neon:#00ff99;--muted:#9fe7bd}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.6 ui-monospace,monospace;background:var(--bg);color:var(--neon)}
header{padding:14px;text-align:center;border-bottom:1px solid rgba(0,255,153,.06);background:rgba(0,0,0,.4)}
.wrap{padding:18px;max-width:1100px;margin:0 auto}
.panel{background:linear-gradient(180deg,rgba(0,255,153,.02),rgba(0,0,0,.5));padding:12px;border-radius:10px;border:1px solid rgba(0,255,153,.06)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--neon);color:#001;padding:8px;border-radius:8px;border:none;cursor:pointer}
.small{font-size:13px;color:var(--muted)}
.list{margin-top:12px}
.item{padding:8px;border-bottom:1px dashed rgba(255,255,255,.03)}
canvas{width:100%;height:180px;background:#03110a;border-radius:8px;display:block}
</style>
</head>
<body>
<header><h1>System Scan — Live (Simulated)</h1><div class="small">Demo-only system scan. No network activity is performed.</div></header>
<div class="wrap">
  <section class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>Active scan</strong><div class="small">Ports · services · pseudo-fingerprints</div></div>
      <div class="row">
        <button class="btn" id="startBtn">Start Scan</button>
        <a class="btn" href="network.html">→ View Network Results</a>
        <a class="btn" href="dashboard.html">← Dashboard</a>
      </div>
    </div>

    <canvas id="scanCanvas" aria-hidden="true"></canvas>

    <div class="list" id="scanLog"></div>
  </section>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const scanLog = document.getElementById('scanLog');
const canvas = document.getElementById('scanCanvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = canvas.clientWidth; canvas.height = 180; }
addEventListener('resize', resize); resize();

let scanning = false, scanInterval;
const fakeTargets = [
  {name:'10.0.0.12',ports:[22,80,443],svc:['ssh','http','https']},
  {name:'10.0.0.36',ports:[554,8080],svc:['rtsp','http-proxy']},
  {name:'192.168.1.5',ports:[22],svc:['ssh']},
  {name:'192.168.1.254',ports:[80],svc:['router-web']},
  {name:'cctv-01.local',ports:[554],svc:['rtsp']}
];

function drawPulse(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx = canvas.width/2, cy = canvas.height/2;
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.arc(cx,cy,20 + (t*0.6 + i*18)%200,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(0,255,153,'+ (0.08 + i*0.02) +')';
    ctx.stroke();
  }
}

function log(msg){ const d = document.createElement('div'); d.className='item'; d.textContent = '[' + new Date().toISOString().slice(11,19) + '] ' + msg; scanLog.insertBefore(d, scanLog.firstChild); }

function simulateScanStep(){
  const tgt = fakeTargets[Math.floor(Math.random()*fakeTargets.length)];
  const p = tgt.ports[Math.floor(Math.random()*tgt.ports.length)];
  const svc = tgt.svc && tgt.svc[Math.floor(Math.random()*tgt.svc.length)] || 'unknown';
  log(`Discovered ${tgt.name} — port ${p} (${svc}) — fingerprint: demo-sig-${Math.random().toString(36).slice(2,8)}`);
}

let animTs = 0;
function animLoop(ts){ animTs = ts; if(scanning) drawPulse(ts/40); requestAnimationFrame(animLoop); }
requestAnimationFrame(animLoop);

startBtn.addEventListener('click', ()=>{
  if(scanning){ scanning = false; startBtn.textContent='Start Scan'; clearInterval(scanInterval); log('Scan stopped (simulated).'); } else { scanning = true; startBtn.textContent='Stop Scan'; log('Scan started (simulated).'); scanInterval = setInterval(simulateScanStep, 800 + Math.random()*900); }
});
log('Awaiting user to start simulated scan.');
</script>
</body>
</html>
