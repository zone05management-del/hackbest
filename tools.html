<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tools — Enhanced Demo</title>
<style>
:root{--bg:#000;--neon:#00ff99;--muted:#9fe7bd}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--neon);font:15px/1.6 ui-monospace,monospace}
#matrix{position:fixed;inset:0;z-index:0}
header{position:sticky;top:0;background:rgba(0,0,0,.5);padding:12px;z-index:2;border-bottom:1px solid rgba(0,255,153,.06)}
.wrap{position:relative;z-index:1;max-width:1100px;margin:18px auto;padding:12px}
.controls{display:flex;gap:8px;align-items:center}
.btn{background:var(--neon);color:#001;padding:8px;border-radius:8px;border:none;cursor:pointer}
.panel{padding:12px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);border:1px solid rgba(255,255,255,.04)}
.job-list{margin-top:12px}
.job{padding:8px;border-bottom:1px dashed rgba(255,255,255,.03);display:flex;justify-content:space-between;align-items:center}
.progress{height:10px;background:rgba(255,255,255,.04);border-radius:8px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#00ff99,#38fbe0)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:60;padding:12px}
.modal.show{display:flex}
.sheet{width:94vw;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.04)}
.small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<header>
  <h1 style="margin:0">TOOLS — DEMO</h1>
</header>
<div class="wrap">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>Password Jobs</strong><div class="small">Simulated jobs, queue, and many examples</div></div>
      <div><button id="newJob" class="btn">Create Demo Jobs</button></div>
    </div>

    <div class="job-list" id="jobs"></div>
    <div style="margin-top:12px" class="small">All tools are cosmetic UI-only.</div>
  </div>
</div>

<div id="modal" class="modal" aria-hidden="true"></div>

<script>
// matrix rain
const m = document.getElementById('matrix'), mc = m.getContext('2d');
let W,H,cols,drops; function r(){W=m.width=innerWidth;H=m.height=innerHeight;cols=Math.ceil(W/14);drops=Array(cols).fill(0)} addEventListener('resize',r); r();
const glyphs='0123456789ABCDEF';
(function a(){ mc.fillStyle='rgba(0,0,0,0.08)'; mc.fillRect(0,0,W,H); mc.fillStyle='#00ff99'; mc.font='14px monospace'; for(let i=0;i<cols;i++){ const ch=glyphs[Math.floor(Math.random()*glyphs.length)]; mc.fillText(ch,i*14,drops[i]*14); if(drops[i]*14>H && Math.random()>0.975) drops[i]=0; drops[i]++; } requestAnimationFrame(a); })();

// demo job system
let JOBS = JSON.parse(localStorage.getItem('demo_jobs')||'null') || [];
function uid(p='id'){return p+'-'+Math.random().toString(36).slice(2,9);}
function genJobs(n=6){ for(let i=0;i<n;i++){ JOBS.push({id:uid('job'), target:'demo-target-'+rand(1,999), mode:pick(['wordlist','mask','brute']), progress:rand(0,40), created:new Date().toISOString()}); } localStorage.setItem('demo_jobs', JSON.stringify(JOBS)); renderJobs(); }
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function renderJobs(){
  const el = document.getElementById('jobs'); el.innerHTML='';
  if(!JOBS.length) el.innerHTML = '<div class="small">No jobs — create demo jobs.</div>';
  JOBS.forEach(j=>{
    const node = document.createElement('div'); node.className='job';
    node.innerHTML = `<div><div style="font-weight:800">${j.id}</div><div class="small">${j.target} · ${j.mode} · created ${j.created.slice(0,10)}</div></div>
      <div style="width:320px"><div class="progress" style="margin-bottom:6px"><div class="bar" style="width:${j.progress}%"></div></div><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn run" data-id="${j.id}">Run</button><button class="ghost cancel" data-id="${j.id}">Cancel</button></div></div>`;
    el.appendChild(node);
  });
  document.querySelectorAll('.run').forEach(b=>b.addEventListener('click', e=>runJob(e.target.dataset.id)));
  document.querySelectorAll('.cancel').forEach(b=>b.addEventListener('click', e=>{ JOBS = JOBS.filter(j=>j.id!==e.target.dataset.id); localStorage.setItem('demo_jobs', JSON.stringify(JOBS)); renderJobs(); }));
}

function runJob(id){
  const job = JOBS.find(j=>j.id===id);
  if(!job) return;
  const modal=document.getElementById('modal'); modal.innerHTML='';
  const s=document.createElement('div'); s.className='sheet';
  s.innerHTML=`<header style="display:flex;justify-content:space-between;align-items:center"><div><strong>Job ${job.id}</strong><div class="small">${job.target} · ${job.mode}</div></div><div><button id="close" class="ghost">Close</button></div></header>
    <div style="margin-top:10px"><div class="progress"><div id="bar" class="bar" style="width:${job.progress}%"></div></div><div id="log" class="small" style="margin-top:8px;min-height:100px">Log: starting...</div></div>`;
  modal.appendChild(s); modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
  s.querySelector('#close').addEventListener('click', ()=>{ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); setTimeout(()=>modal.innerHTML='',250); });
  const bar = s.querySelector('#bar'), log = s.querySelector('#log');
  let p = job.progress;
  const iv = setInterval(()=>{
    p = Math.min(100, p + rand(3,12));
    bar.style.width = p + '%';
    log.textContent = 'Progress ' + p + '% — ' + pick(['loading wordlist','applying mask','checking hash','computing candidate','stopping']) ;
    if(p>=100){ clearInterval(iv); log.textContent = 'Job completed (simulated). No real attacks performed.'; JOBS = JOBS.filter(j=>j.id!==id); localStorage.setItem('demo_jobs', JSON.stringify(JOBS)); renderJobs(); }
  }, 400);
}

document.getElementById('newJob').addEventListener('click', ()=>{ genJobs(6); });

renderJobs();
</script>
</body>
</html>
