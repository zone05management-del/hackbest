<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Override — Enhanced Demo</title>
<style>
:root{--bg:#000;--neon:#00ff99;--muted:#9fe7bd}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--neon);font:15px/1.6 ui-monospace,monospace}
#matrix{position:fixed;inset:0;z-index:0}
header{position:sticky;top:0;padding:12px;background:rgba(0,0,0,.5);z-index:2}
.wrap{position:relative;z-index:1;max-width:1100px;margin:18px auto;padding:12px}
.panel{padding:12px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);border:1px solid rgba(255,255,255,.04)}
.service{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px dashed rgba(255,255,255,.03)}
.btn{background:var(--neon);color:#001;padding:8px;border-radius:8px;border:none;cursor:pointer}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.04);padding:8px;border-radius:8px;color:var(--neon)}
.terminal{margin-top:12px;padding:10px;border-radius:8px;background:#06120a;border:1px solid rgba(0,255,153,.06);min-height:120px}
</style></head><body>
<canvas id="matrix" aria-hidden="true"></canvas>
<header><h1 style="margin:0">SYSTEM OVERRIDE — DEMO</h1></header>
<div class="wrap">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><strong>Services</strong><div class="small">Toggle many simulated services and view logs</div></div><div><button id="arm" class="btn">ARM OVERRIDE</button></div></div>
    <div style="margin-top:12px" id="services"></div>
    <div style="margin-top:12px" class="small">Note: UI-only, no real system access.</div>
    <div class="terminal" id="term"></div>
  </div>
</div>
<script>
// matrix
const mx=document.getElementById('matrix'), ctx=mx.getContext('2d'); let W,H,cols,drops; function s(){W=mx.width=innerWidth;H=mx.height=innerHeight;cols=Math.ceil(W/14);drops=Array(cols).fill(0);} addEventListener('resize',s); s();
const g='01ABC'; (function r(){ ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#00ff99'; ctx.font='14px monospace'; for(let i=0;i<cols;i++){ const ch=g[Math.floor(Math.random()*g.length)]; ctx.fillText(ch,i*14,drops[i]*14); if(drops[i]*14>H && Math.random()>0.975) drops[i]=0; drops[i]++; } requestAnimationFrame(r); })();

const services=['cron','sshd','nginx','db','mesh-relay','camera-daemon','payment-proxy','telemetry','scheduler','auth-service','gateway','proxy'];
const container=document.getElementById('services'), term=document.getElementById('term');
function termLog(s){ const d=document.createElement('div'); d.textContent = new Date().toLocaleTimeString() + ' · ' + s; term.insertBefore(d, term.firstChild); }
services.forEach(svc=>{
  const el=document.createElement('div'); el.className='service'; el.innerHTML = `<div><strong>${svc}</strong><div class="small">Simulated unit</div></div><div style="display:flex;gap:8px"><button class="btn toggle" data-s="${svc}">Toggle</button><button class="ghost crash" data-s="${svc}">Crash</button></div>`; container.appendChild(el);
});
container.addEventListener('click', e=>{
  if(e.target.matches('.toggle')){ const s=e.target.dataset.s; e.target.textContent='Toggling…'; setTimeout(()=>{ e.target.textContent='Toggle'; termLog('Toggled '+s+' (demo)'); },700); }
  if(e.target.matches('.crash')){ const s=e.target.dataset.s; termLog('Simulating crash of '+s+' (demo)'); alert('Crash simulated (UI-only) for '+s); }
});
document.getElementById('arm').addEventListener('click', ()=>{ termLog('Override armed (simulated)'); alert('Override armed (demo only)'); });
</script>
</body>
</html>
